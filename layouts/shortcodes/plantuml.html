<!-- layouts/shortcodes/plantuml.html -->
{{ $diagram := .Inner | strings.TrimSpace }}
{{ $id := md5 $diagram }}
<div id="plantuml-{{ $id }}" style="max-width:100%; display:block; margin:auto; min-height:100px; border:1px solid #ccc; padding:10px;">
  Loading diagram...
</div>
<script>
(async function() {
  const diagram = {{ $diagram | jsonify }};
  const container = document.getElementById("plantuml-{{ $id }}");
  
  // Debug: Check if we got the diagram content
  console.log("Diagram content:", diagram);
  console.log("Container found:", container);
  
  try {
    console.log("Sending request to PlantUML...");
    
    const response = await fetch("https://www.plantuml.com/plantuml/svg", {
      method: "POST",
      headers: {
        'Content-Type': 'text/plain'
      },
      body: diagram
    });
    
    console.log("Response status:", response.status);
    console.log("Response OK:", response.ok);
    
    const svg = await response.text();
    console.log("SVG received, length:", svg.length);
    console.log("First 200 chars:", svg.substring(0, 200));
    
    container.innerHTML = svg;
    console.log("Diagram rendered successfully!");
    
  } catch (e) {
    console.error("Error details:", e);
    container.innerHTML = '<p style="color:red;">Failed to load diagram: ' + e.message + '</p>';
  }
})();
</script>
