<!-- layouts/shortcodes/plantuml.html -->
{{ $diagram := .Inner | strings.TrimSpace }}
{{ $id := md5 $diagram }}
<div id="plantuml-{{ $id }}" style="max-width:100%; display:block; margin:auto;">
  <p style="text-align:center; color:#999;">Loading diagram...</p>
</div>
<script>
(function() {
  const diagram = {{ $diagram | jsonify }};
  const container = document.getElementById('plantuml-{{ $id }}');
  alert(diagram)
  fetch('https://kroki.io/plantuml/svg', {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: diagram
  })
  .then(r => r.text())
  .then(svg => {
    container.innerHTML = svg;
  })
  .catch(e => {
    alert(e)
    container.innerHTML = '<p style="color:red;">Failed to load diagram: ' + e.message + '</p>';
  });
})();
</script>
