<!-- layouts/shortcodes/plantuml.html -->
{{ $diagram := .Inner | strings.TrimSpace }}
{{ $id := md5 $diagram }}
<div id="plantuml-{{ $id }}" style="max-width:100%; display:block; margin:auto;">Loading...</div>
<script>
(async function() {
  const diagram = {{ $diagram | jsonify }};
  const container = document.getElementById("plantuml-{{ $id }}");
  
  try {
    const response = await fetch("https://www.plantuml.com/plantuml/svg", {
      method: "POST",
      body: diagram
    });
    const svg = await response.text();
    container.innerHTML = svg;
  } catch (e) {
    container.innerHTML = '<p style="color:red;">Failed to load diagram</p>';
  }
})();
</script>
